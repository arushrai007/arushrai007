<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="850" height="380">
  <defs>
    <linearGradient id="abt-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="abt-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <pattern id="abt-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
    <clipPath id="abt-bar1-clip"><rect x="0" y="0" width="108" height="4" rx="2"/></clipPath>
    <clipPath id="abt-bar2-clip"><rect x="0" y="0" width="108" height="4" rx="2"/></clipPath>
    <clipPath id="abt-bar3-clip"><rect x="0" y="0" width="108" height="4" rx="2"/></clipPath>
  </defs>

  <!-- Base Container -->
  <rect x="1" y="1" width="848" height="378" rx="16" fill="#070b16"/>
  <rect x="1" y="1" width="848" height="378" rx="16" fill="url(#abt-dots)"/>
  <rect x="1" y="1" width="848" height="378" rx="16" fill="none" stroke="url(#abt-border-grad)" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#247bff" letter-spacing="2">01 // CORE CAPABILITIES &amp; INTERESTS</text>
    <line x1="300" y1="-4" x2="810" y2="-4" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Left Column: Capabilities (x=40, width=365) -->
  <g transform="translate(40, 65)">
    <!-- Capability 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="365" height="85" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <circle cx="32" cy="30" r="14" fill="#0f2142"/>
      <path d="M 27 30 L 37 30 M 32 25 L 32 35 M 29 27 L 35 33" stroke="#247bff" stroke-width="2"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Agentic AI &amp; Self-Critique Loops</text>
      <text x="56" y="47" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Multi-agent graphs, adversarial evaluation,</text>
      <text x="56" y="63" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">LangGraph state machines &amp; parent-doc RAG.</text>
    </g>

    <!-- Capability 2 -->
    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="365" height="85" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <circle cx="32" cy="30" r="14" fill="#2c1424"/>
      <path d="M 28 32 L 32 24 L 31 30 L 36 30 L 30 38 L 32 32 Z" fill="#ff354f"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">High-Throughput Microservices</text>
      <text x="56" y="47" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">FastAPI &amp; Spring Boot asynchronous APIs,</text>
      <text x="56" y="63" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Redis caching, PostgreSQL &amp; Qdrant vector DB.</text>
    </g>

    <!-- Capability 3 -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="365" height="85" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <circle cx="32" cy="30" r="14" fill="#0f2628"/>
      <path d="M 26 33 A 6 6 0 0 1 36 29 A 5 5 0 0 1 40 34 L 26 34 Z" stroke="#10b981" stroke-width="1.8" fill="none"/>
      <text x="56" y="27" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Cloud &amp; MLOps Infrastructure</text>
      <text x="56" y="47" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Docker containerization, Kubernetes clusters,</text>
      <text x="56" y="63" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Jenkins automated CI/CD &amp; Prometheus telemetry.</text>
    </g>
  </g>

  <!-- Right Column: 3-Slide Interests Carousel (x=430, width=380) -->
  <g transform="translate(430, 65)">
    <!-- Container Card -->
    <rect x="0" y="0" width="380" height="281" rx="14" fill="#0a101f" stroke="#247bff" stroke-opacity="0.35" stroke-width="1.2"/>
    
    <!-- Header -->
    <g transform="translate(20, 26)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#93c5fd" letter-spacing="1.5">ROTATING PERSPECTIVE // 4s CYCLE</text>
      <circle cx="330" cy="-4" r="3.5" fill="#247bff">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <line x1="20" y1="38" x2="360" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- SLIDE 1 (Visible by default; 0s-4s) -->
    <g transform="translate(20, 65)" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.31;0.33;0.64;0.66;0.98;1" dur="12s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="160" height="22" rx="6" fill="#0c1e3d"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60a5fa">SLIDE 01 : AGENTIC AI</text>
      
      <text x="0" y="45" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#ffffff">Reasoning Over Autocomplete</text>
      
      <text x="0" y="73" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">"I build agentic architectures that plan, reason,</text>
      <text x="0" y="93" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">and self-critique before executing. Real AI value</text>
      <text x="0" y="113" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">lies in deterministic verification loops, not raw tokens."</text>

      <rect x="0" y="132" width="230" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93c5fd">LangGraph • Tavily • Llama 3.3 • RAG</text>
    </g>

    <!-- SLIDE 2 (Default opacity=0; 4s-8s) -->
    <g transform="translate(20, 65)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.31;0.33;0.64;0.66;0.98;1" dur="12s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="180" height="22" rx="6" fill="#2d1522"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f87171">SLIDE 02 : ALGORITHMIC RIGOR</text>
      
      <text x="0" y="45" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#ffffff">200+ Competitive DSA Solved</text>
      
      <text x="0" y="73" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">"Consistent problem solving across LeetCode &amp; GFG.</text>
      <text x="0" y="93" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">Deep focus on graph traversals, dynamic programming,</text>
      <text x="0" y="113" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">and optimal time/space complexity guarantees."</text>

      <rect x="0" y="132" width="220" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fca5a5">LeetCode • GFG • NeetCode • Java/Py</text>
    </g>

    <!-- SLIDE 3 (Default opacity=0; 8s-12s) -->
    <g transform="translate(20, 65)" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.64;0.66;0.97;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="180" height="22" rx="6" fill="#0e2329"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">SLIDE 03 : CLOUD SCALE</text>
      
      <text x="0" y="45" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#ffffff">Top 5% NPTEL Cloud Computing</text>
      
      <text x="0" y="73" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">"Ranked in national top tier for cloud computing.</text>
      <text x="0" y="93" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">Architecting distributed pipelines that handle</text>
      <text x="0" y="113" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">sub-second inference and zero-downtime deploys."</text>

      <rect x="0" y="132" width="225" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6ee7b7">Docker • Kubernetes • Jenkins • Redis</text>
    </g>

    <!-- Segmented Progress Bars (y=252) -->
    <g transform="translate(20, 252)">
      <!-- Segment 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="108" height="4" rx="2" fill="#1e293b"/>
        <g clip-path="url(#abt-bar1-clip)">
          <rect x="0" y="0" width="0" height="4" fill="url(#abt-bar-grad)">
            <animate attributeName="width" values="0;108;108;108;0" keyTimes="0;0.31;0.98;0.99;1" dur="12s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
      <!-- Segment 2 -->
      <g transform="translate(116, 0)">
        <rect x="0" y="0" width="108" height="4" rx="2" fill="#1e293b"/>
        <g clip-path="url(#abt-bar2-clip)">
          <rect x="0" y="0" width="0" height="4" fill="url(#abt-bar-grad)">
            <animate attributeName="width" values="0;0;108;108;0" keyTimes="0;0.33;0.64;0.98;1" dur="12s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
      <!-- Segment 3 -->
      <g transform="translate(232, 0)">
        <rect x="0" y="0" width="108" height="4" rx="2" fill="#1e293b"/>
        <g clip-path="url(#abt-bar3-clip)">
          <rect x="0" y="0" width="0" height="4" fill="url(#abt-bar-grad)">
            <animate attributeName="width" values="0;0;108;0" keyTimes="0;0.66;0.97;1" dur="12s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>
  </g>
</svg>