<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440">
  <defs>
    <linearGradient id="stk-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="stk-orbit1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="stk-orbit2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="stk-orbit3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="stk-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    @keyframes stk-pulse-core {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .core-node {
      transform-origin: 425px 145px;
      animation: stk-pulse-core 3s ease-in-out infinite;
    }
    .orbit-badge {
      transition: transform 0.2s;
    }
    @media (prefers-reduced-motion: reduce) {
      .core-node { animation: none !important; }
    }
  </style>

  <!-- Base Container -->
  <rect x="1" y="1" width="848" height="438" rx="16" fill="#070b16"/>
  <rect x="1" y="1" width="848" height="438" rx="16" fill="url(#stk-dots)"/>
  <rect x="1" y="1" width="848" height="438" rx="16" fill="none" stroke="url(#stk-border-grad)" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#247bff" letter-spacing="2">02 // TECH STACK &amp; SYSTEM ORBITS</text>
    <line x1="280" y1="-4" x2="810" y2="-4" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- 3 Tilted Elliptical Orbits (Centered around 425, 145, rotated -7 deg) -->
  <g transform="rotate(-7 425 145)">
    <!-- Outer Orbit (AI &amp; Core Frameworks) -->
    <ellipse cx="425" cy="145" rx="335" ry="78" fill="none" stroke="url(#stk-orbit1-grad)" stroke-width="1.5" stroke-dasharray="6,4"/>
    
    <!-- Middle Orbit (Backend &amp; Infra) -->
    <ellipse cx="425" cy="145" rx="230" ry="54" fill="none" stroke="url(#stk-orbit2-grad)" stroke-width="1.5" stroke-dasharray="5,3"/>
    
    <!-- Inner Orbit (Primary Agents &amp; Runtime) -->
    <ellipse cx="425" cy="145" rx="130" ry="32" fill="none" stroke="url(#stk-orbit3-grad)" stroke-width="1.5"/>
  </g>

  <!-- Glowing Core Node -->
  <g class="core-node" transform="translate(425, 145)">
    <circle cx="0" cy="0" r="32" fill="#0c1b33" stroke="#247bff" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#247bff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="-4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#93c5fd" letter-spacing="1">ARUSH</text>
    <text x="0" y="10" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#ff354f" letter-spacing="1.5">AI CORE</text>
  </g>

  <!-- Nodes Placed along Orbits -->
  <!-- Outer Orbit Nodes -->
  <!-- 1. LangGraph -->
  <g class="orbit-badge" transform="translate(100, 155)">
    <rect x="0" y="-14" width="105" height="28" rx="14" fill="#0f172a" stroke="#247bff" stroke-width="1.2"/>
    <circle cx="14" cy="0" r="5" fill="#247bff"/>
    <text x="26" y="4" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">LangGraph</text>
  </g>

  <!-- 2. PyTorch -->
  <g class="orbit-badge" transform="translate(240, 75)">
    <rect x="0" y="-14" width="85" height="28" rx="14" fill="#0f172a" stroke="#ff354f" stroke-width="1.2"/>
    <circle cx="14" cy="0" r="5" fill="#ff354f"/>
    <text x="26" y="4" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">PyTorch</text>
  </g>

  <!-- 3. Docker -->
