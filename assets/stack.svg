  <g class="orbit-badge" transform="translate(200, 175)">
    <rect x="0" y="-14" width="85" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="14" cy="0" r="5" fill="#10b981"/>
    <text x="26" y="4" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">FastAPI</text>
