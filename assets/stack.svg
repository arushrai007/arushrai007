        <text x="372" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">Groq</text>

        <!-- Llama 3.3 -->
        <rect x="430" y="0" width="88" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="440" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">Llama 3.3</text>

        <!-- Tavily -->
        <rect x="526" y="0" width="68" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="536" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">Tavily</text>
      </g>
    </g>

    <!-- Row 2: Backend &amp; Cloud -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#0f172a" stroke="#ff354f" stroke-width="1"/>
      <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fca5a5">BACKEND/CLOUD</text>
      
      <!-- Chips -->
      <g transform="translate(138, 0)">
        <rect x="0" y="0" width="74" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="10" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">FastAPI</text>

        <rect x="82" y="0" width="94" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
