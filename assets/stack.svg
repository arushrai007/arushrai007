        <text x="372" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">Jenkins</text>

        <rect x="444" y="0" width="92" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="454" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">PostgreSQL</text>

        <rect x="544" y="0" width="58" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="554" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">Redis</text>
