    <text x="28" y="4" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Docker</text>
  </g>

  <!-- 4. Kubernetes -->
  <g class="orbit-badge" transform="translate(660, 155)">
    <rect x="0" y="-14" width="110" height="28" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <path d="M12.001 0a2.38 2.38 0 00-.912.18L3.255 3.755a2.41 2.41 0 00-1.42 2.183v8.124a2.41 2.41 0 001.42 2.183l7.834 3.575a2.41 2.41 0 001.824 0l7.834-3.575a2.41 2.41 0 001.42-2.183V5.938a2.41 2.41 0 00-1.42-2.183L12.913.18A2.38 2.38 0 0012.001 0zm0 3.238l5.85 2.668-2.22 3.845a5.77 5.77 0 00-7.26 0L6.151 5.906l5.85-2.668zm-5.46 5.864l2.22 3.845a5.77 5.77 0 003.24 4.936V20.5l-5.46-2.491V9.102zm10.92 0v8.907L12 20.5v-2.617a5.77 5.77 0 003.24-4.936l2.22-3.845z" transform="translate(8, -8) scale(0.65)" fill="#3b82f6"/>
    <text x="28" y="4" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Kubernetes</text>
  </g>

  <!-- Middle Orbit Nodes -->
