    <rect x="0" y="-14" width="85" height="28" rx="14" fill="#0f172a" stroke="#ff354f" stroke-width="1.2"/>
    <circle cx="14" cy="0" r="5" fill="#ff354f"/>
    <text x="26" y="4" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Qdrant</text>
  </g>

  <!-- 7. Spring Boot -->
  <g class="orbit-badge" transform="translate(560, 185)">
    <rect x="0" y="-14" width="105" height="28" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
    <circle cx="14" cy="0" r="5" fill="#22c55e"/>
    <text x="26" y="4" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Spring Boot</text>
  </g>

  <!-- Inner Orbit Nodes -->
  <!-- 8. Python -->
  <g class="orbit-badge" transform="translate(320, 175)">
    <rect x="0" y="-13" width="80" height="26" rx="13" fill="#0c1b33" stroke="#eab308" stroke-width="1.2"/>
    <path d="M14.25.18l.9.2.73.26.59.3.45.32.34.34.25.34.16.33.1.3.04.26v2.9H13.8v-.93l-.04-.3-.1-.28-.17-.25-.26-.23-.35-.2-.46-.16-.57-.1-.7-.04-1.04.03-.73.12-.6.2-.48.27-.38.35-.27.4-.17.43-.07.45v2.9h6.14l.43.04.4.1.35.16.3.2.23.25.17.3.1.32.04.35v6.52l-.04.35-.1.33-.17.3-.23.25-.3.2-.35.15-.4.1-.43.05H13.8v-3.03h3.5v-.87H8.76l-.43-.04-.4-.1-.35-.16-.3-.2-.23-.25-.17-.3-.1-.32-.04-.35V7.4l.04-.35.1-.33.17-.3.23-.25.3-.2.35-.15.4-.1.43-.05h6.14V2.26l.04-.34.1-.32.17-.3.23-.25.3-.2.35-.15.4-.1.43-.05.74-.03z" transform="translate(7, -7) scale(0.6)" fill="#eab308"/>
    <text x="25" y="4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Python</text>
  </g>

  <!-- 9. React -->
  <g class="orbit-badge" transform="translate(460, 115)">
    <rect x="0" y="-13" width="75" height="26" rx="13" fill="#0c1b33" stroke="#06b6d4" stroke-width="1.2"/>
    <path d="M14.23 12.004c0 1.231-.999 2.23-2.23 2.23s-2.23-.999-2.23-2.23.999-2.23 2.23-2.23 2.23.999 2.23 2.23zm7.765 0c0-1.638-.973-3.197-2.67-4.275C17.65 6.666 15.01 6 12 6s-5.65.666-7.325 1.729C2.978 8.807 2.005 10.366 2.005 12.004c0 1.638.973 3.197 2.67 4.275C6.35 17.342 8.99 18.008 12 18.008s5.65-.666 7.325-1.729c1.697-1.078 2.67-2.637 2.67-4.275zm-3.328 0c0 .942-.647 1.954-1.895 2.748-1.393.886-3.36 1.394-5.502 1.394-2.142 0-4.109-.508-5.502-1.394-1.248-.794-1.895-1.806-1.895-2.748 0-.942.647-1.954 1.895-2.748C4.563 8.368 6.53 7.86 8.672 7.86c2.142 0 4.109.508 5.502 1.394 1.248.794 1.895 1.806 1.895 2.748z" transform="translate(7, -7) scale(0.6)" fill="#06b6d4"/>
    <text x="25" y="4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">React</text>
  </g>

  <!-- Bottom Grouped Stack Chips (y=255 to 415) -->
  <g transform="translate(40, 250)">
    <!-- Row 1: Agentic &amp; AI -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#0f172a" stroke="#247bff" stroke-width="1"/>
      <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#93c5fd">AGENTIC &amp; AI</text>
      
      <!-- Chips -->
