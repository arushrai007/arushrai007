        <!-- LangGraph -->
        <rect x="0" y="0" width="92" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="10" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">LangGraph</text>
        
        <!-- LangChain -->
        <rect x="100" y="0" width="90" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="110" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">LangChain</text>

        <!-- PyTorch -->
        <rect x="198" y="0" width="76" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="208" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">PyTorch</text>

        <!-- Qdrant -->
        <rect x="282" y="0" width="72" height="26" rx="6" fill="#0b1120" stroke="#1e293b"/>
        <text x="292" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#e2e8f0">Qdrant</text>

        <!-- Groq -->
